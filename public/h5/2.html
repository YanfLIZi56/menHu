<script>


    var that;
    var app = new Vue({
        el: '#app',
        data: {
            msg: 'vue启动成功',
            cxfullname:'',
            cxshenFenZheng:'',
            cxZu:'',
            listZu:[],

        },
        mounted() {
            that = this;
            console.log(that.msg);
            //窗口尺寸改变
            window.onresize = () => {
                return (() => {
                    // this.$forceUpdate();//强制更新数据
                    //this.$router.go(0);
                })();
            };
        },
        methods: {
            getZuList(){
                PostUrl('/api/v2.Home/getZu',{}, function (e) {
                    that.listZu=e.data;
                },'摘取组列表')
            },
            submits() {
                if(!that.cxfullname){alert('姓名不能为空');return false;}
                if(!that.cxshenFenZheng){alert('身份证号不能为空');return false;}
                if(!that.cxZu){alert('请选择组别');return false;}


                PostUrl('/api/v2.Login/xueXiaoLogin', {cxfullname: that.cxfullname, cxshenFenZheng: that.cxshenFenZheng}, function (e) {
                    alert(e.mess);
                    if(e.codes==200){
                        localStorage.token=e.data.token;
                        localStorage.level=e.data.level;
                        localStorage.id=e.data.id;
                        localStorage.name=e.data.name;
                        localStorage.sfz=e.data.sfz;
                        localStorage.img=e.data.img;
                        localStorage.passed=e.data.passed;
                        setTimeout(()=>{
                            location.href='viewList.html?cxzuid='+that.cxZu;
                        },1000)
                    }else{
                    }
                },'登陆')

            },

        }
    })


    new Vue({el: ".public-header",});
    new Vue({el: ".public-footer",});
</script>
