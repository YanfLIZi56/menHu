<body >

<div id="app"  >
    <public-header  v-bind:menu="menu"></public-header>

    <div style="background: url(https://vkceyugu.cdn.bspapp.com/VKCEYUGU-908027cd-0849-4303-ae20-d3bed9830e3a/0e3b462b-48b3-4924-8038-e7ff2168220d.gif) repeat-x top; padding-top:11px;">
        <div class="w1200 bgWhite">
            <div class="title1 lines">
                <div class="t1">会员注册</div>
            </div>
            <div  style="padding-bottom:60px; width: 50%; margin:0 auto;">
                <form class="layui-form" action=""  lay-filter="example"   >
                    <div class="layui-form-item">
                        <label class="layui-form-label">登陆账号</label>
                        <div class="layui-input-block">
                            <input type="text" name="" v-model="userInfo.cxusername"  autocomplete="off"  placeholder="请输入手机号" class="layui-input" style="width:400px;">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">登陆密码</label>
                        <div class="layui-input-inline">
                            <input type="password" name="" autocomplete="off" v-model="userInfo.cxpassword1" placeholder="请输入密码"  class="layui-input" style="width: 400px;">
                        </div>>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">再次输入登陆密码</label>
                        <div class="layui-input-inline">
                            <input type="password" name=""  autocomplete="off" v-model="userInfo.cxpassword2" placeholder="请再次输入密码"  class="layui-input" style="width: 400px;">
                        </div>>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">姓名</label>
                        <div class="layui-input-inline">
                            <input type="password" name="" autocomplete="off" v-model="userInfo.cxfullname" placeholder="请输入姓名"  class="layui-input" style="width: 400px;">
                        </div>>
                    </div>
                    <div class="cen">
                        <br>
                        <a class="layui-btn layui-btn-danger" @click="regs()">提交注册</a>

                        <a class="layui-btn layui-btn-danger" @click="reset()">重置</a>
                        <br>
                        <br>
                        <br>
                        <div     >

                            <a  @click="location.href='login.html'"     style="cursor: pointer;">我已经有账号了，直接登陆</a>
                            &nbsp;&nbsp;&nbsp;
                        </div>


                    </div>
                </form>

            </div>
        </div>
    </div>

    <public-footer class="public-footer" v-bind:menu="menu"></public-footer>

</div>


</body>
