<!DOCTYPE html>
<html lang="zh_CN">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="all"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="renderer" content="webkit"/>
    <meta name="viewport" content="width=device-width,initial-scale=0.8,maximum-scale=2.0,minimum-scale=0.1,user-scalable=1"/>
    <link rel="icon" href="favicon.ico"/>
    <title>汕头市红十字会 官方网站 www.stredcross.org.cn</title>

    <script type="text/javascript" src="../js/jquery/dist/jquery.js"></script>

    <link href="https://api.bcwhkj.cn/Css/animate.min.css" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="https://api.bcwhkj.cn/swiper/swiper.css"/>
    <script src="https://api.bcwhkj.cn/swiper/swiper.js"></script>


    <link rel="stylesheet" href="../js/layui/dist/css/layui.css">
    <script src="../js/layui/dist/layui.js"></script>


    <script src="https://api.bcwhkj.cn/Js/vue.min.v2.6.14.js"></script>
    <script src="https://api.bcwhkj.cn/Js/axios.min.js"></script>
    <script src="https://api.bcwhkj.cn/Js/moment.min.js"></script>
    <script src="https://api.bcwhkj.cn/Js/qs.min.js"></script>
    <script src="https://api.bcwhkj.cn/Js/wow.min.js"></script>



    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/icon/iconfont.css" rel="stylesheet">
    <script src="../js/pubjs.js"></script>
    <script src="../js/index.js"></script>
    <script src="header.js"></script>
    <script src="footer.js"></script>
<body >

<div id="app"  >
    <public-header  v-bind:menu="menu"></public-header>
    <div style="background: url(https://vkceyugu.cdn.bspapp.com/VKCEYUGU-908027cd-0849-4303-ae20-d3bed9830e3a/0e3b462b-48b3-4924-8038-e7ff2168220d.gif) repeat-x top; padding-top:11px;">
        <div class="w1200 bgWhite" v-if="!localStorage.id">
            <div class="title1 lines">
                <div class="t1">会员登陆</div>
            </div>
            <div  style="padding-bottom:60px; width: 50%; margin:0 auto;">
                <form class="layui-form" action=""  lay-filter="example"   >
                    <div class="layui-form-item">
                        <label class="layui-form-label">登陆账号</label>
                        <div class="layui-input-block">
                            <input type="text" name=""  autocomplete="off" v-model="userInfo.cxusername"   placeholder="请输入手机号" class="layui-input" style="width:400px;">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">登陆密码</label>
                        <div class="layui-input-inline">
                            <input type="password" name="" autocomplete="off" v-model="userInfo.cxpassword" placeholder="请输入密码"  class="layui-input" style="width: 400px;">
                        </div>>
                    </div>
                    <div class="cen">
                        <br>
                        <a class="layui-btn layui-btn-danger" @click="logins()">登陆</a>

                        <a class="layui-btn layui-btn-danger" @click="reset()">重置</a>
                        <br>
                        <br>
                        <br>
                        <div      style="display: none">

                            <a  @click="location.href='userForgetPassword.html'"     style="cursor: pointer;">忘记密码</a>
                            &nbsp;&nbsp;&nbsp;
                            <a  @click="location.href='reg.html'"  style="cursor: pointer">注册会员</a>
                        </div>


                    </div>
                </form>

            </div>
        </div>
    </div>



    <div class="w1200 bgWhite" v-if="localStorage.id">
        <div class="title1 lines">
            <div class="t1">会员中心</div>
        </div>
        <div  style="padding-bottom:60px; width: 50%; margin:0 auto;">
            <form class="layui-form" action=""  lay-filter="example"   >
                <div class="layui-form-item">
                    <label class="layui-form-label">登陆编号：</label>
                    <div class="layui-input-block" style="line-height: 35px; font-weight: 800; border-bottom:1px solid #666;">
                        {{localStorage.id}}
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">姓名：</label>
                    <div class="layui-input-block" style="line-height: 35px; font-weight: 800; border-bottom:1px solid #666;">
                        {{localStorage.name}}
                    </div>
                </div>
                <div class="cen">
                    <br>
                    <a class="layui-btn layui-btn-danger" @click="loginOut()">退出登陆</a>

                    <a class="layui-btn layui-btn-danger" @click="history.go(-1)">返回</a>
                    <br>
                    <br>
                    <br>

                </div>
            </form>

        </div>
    </div>
    <public-footer class="public-footer" v-bind:menu="menu"></public-footer>
</div>



</body>
</html>


<script src="/h5/v.js?v=2"></script>
