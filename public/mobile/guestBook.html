                    <div class="cen forms">
                        <table class="layui-table"  lay-skin="line">

                                <td>姓名：</td>
                                <td><input type="text" v-model="liuYan.cxtitlecn" placeholder="请输入联系人姓名" ></td>

                            </tr>
                            <tr>

                            </tr>
