<script>


	var _this;
	var app = new Vue({
		el: '#app',
		data:{
			msg: '......',
			Info:{
				cxusername:'',
				cxpassword:'',
			},

		},
		mounted () {
			that = this;


		},
		methods:{
			login(){
				if(!that.Info.cxusername){alert('账号不能为空！');return false;}
				if(!that.Info.cxpassword){alert('密码不能为空！');return false;}

				PostUrl('/bc.Login/adminLogin', {
					cxusername:that.Info.cxusername,
					cxpassword:kimi(that.Info.cxpassword)
				}, function (e) {
					if(e.codes==200){
						localStorage.adminId=e.data.id;
						localStorage.adminToken=e.data.token;
						localStorage.adminName=e.data.name;
						localStorage.cxpids=e.data.cxpids;
						localStorage.cxMenu=e.data.cxMenu;
						if(e.data.name=='admin'){
							location.href = 'newList.html?cxsortid=400&menuId=245';
						}else{
							location.href = 'newList.html?cxsortid=400&menuId=245';
						}
						return false;
					}else{
						alert(e.mess);
					}
				},'登陆');
			},
		}
	});
</script>
