<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
	<title>数据管理中心</title>


	<!-- Bootstrap  -->
	<link rel="stylesheet" href="https://api.bcwhkj.cn/bootstrap-3.3.7-dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://api.bcwhkj.cn/bootstrap-3.3.7-dist/css/bootstrap-theme.min.css">
	<script type="text/javascript" src="https://api.bcwhkj.cn/Js/jquery1.11.3.min.js"></script>
	<script src="https://api.bcwhkj.cn/bootstrap-3.3.7-dist/js/bootstrap.min.js"></script>

	<link href="https://api.bcwhkj.cn/Css/animate.min.css" rel="stylesheet">

	<link rel="stylesheet" type="text/css" href="https://api.bcwhkj.cn/swiper/swiper.css"/>
	<script src="https://api.bcwhkj.cn/swiper/swiper.js"></script>


	<link rel="stylesheet" href="https://api.bcwhkj.cn/layui2/dist/css/layui.css">
	<script src="https://api.bcwhkj.cn/layui2/dist/layui.js"></script>

	<script src="https://api.bcwhkj.cn/Js/vue.min.v2.6.14.js"></script>
	<script src="https://api.bcwhkj.cn/Js/axios.min.js"></script>
	<script src="https://api.bcwhkj.cn/Js/moment.min.js"></script>
	<script src="https://api.bcwhkj.cn/Js/qs.min.js"></script>
	<script src="https://api.bcwhkj.cn/Js/wow.min.js"></script>

	<script src="header.js"></script>
	<script src="footer.js"></script>
	<script src="/js/pubjs.js"></script>
	<script src="js/admin.js"></script>
	<link rel="stylesheet" href="css/admin.css">

	<!--百度编辑器-->
	<script type="text/javascript" src="/static/baidu/ueditor.config.js"></script>
	<script type="text/javascript" src="/static/baidu/ueditor.all.js"></script>


</head>
<body>
<public-header class="public-header"></public-header>
<div id="app">

	<div  v-show="showList">
		<div class="DaoHan">
			<ul class="breadcrumb" >
				<li>
					<a href="#"><h5> 关键词列表 </h5></a>
				</li>
			</ul>
			<form action="">
				<input type="button"  name="" @click="getList(page,limit,search)" value="刷新" style="display: inline;">
				<select  v-model="search.cxsortid">
					<option value="">搜索类别</option>
					<option :value="item.cxid" v-for="item,key in sortList" :selected="item.cxid==getQV('cxsortid')?'selected':''" >
						{{sortl(item.cxSort)+item.cxsortcn}}
					</option>
				</select>
				<select  v-model="search.cxpassed">
					<option value="">搜索状态</option>
					<option :value="key" v-for="item,key in passedArr" :selected="item.cxpassed==getQV('cxpassed')?'selected':''" >
						{{item}}
					</option>
				</select>
				<input type="text"   style="display: inline;" v-model="search.keyword" placeholder="" @keyup.enter="getList(page,limit,search)">

				<input  type="button" @click="getList(page,limit,search)" value="查询"    style="display: inline;">
				<input type="button"  name="" @click="addInit()" value="添加数据" style="display: inline;">


				<div style="float:none; clear: both;"></div>
			</form>
			<div class="clearfix"></div>
		</div>

		<table class="table table-striped table-hover">
			<tr>
				<td>ID</td>
				<td>状态</td>
				<td >分类</td>
				<td style="display: none;">会员</td>
				<td style="display: none;">图片</td>
				<td>关键词</td>
				<td>分值 </td>
				<td>更新时间</td>
				<td>操作</td>
				<td >勾选</td>
			</tr>
		  <tr v-for="item,key in List" :class="'tr'+item.cxid">
			<td>{{item.cxid}}</td>
			<td>{{passedArr[item.cxpassed]}}</td>
			  <td  :title="'所属分类ID：'+item.cxsortid">{{item.cxsortcn}}</td>
			  <td style="display: none;" :title="'会员ID：'+item.cxuserid">{{item.cxuserName}}</td>
			<td style="display: none;">
				<a :href="item.cximg0" target="_blank" v-if="item.cximg0" title="图1">
				<img :src="item.cximg0" alt="" style="max-width: 80px; max-height:40px; "></a>
				<a :href="item.cximg1" target="_blank" v-if="item.cximg1" title="图2">
				<img :src="item.cximg1" alt="" style="max-width: 80px; max-height:40px; "></a>
			</td>
			  <td >{{item.cxtitlecn}}</td>
			  <td >{{item.cxFen}}</td>
			<td>{{item.cxupdatetime}}</td>
			<td >
				<a @click="editInit(item.cxid)" style="cursor:pointer;">编辑</a>   &nbsp;&nbsp;
				<a @click="copy(item.cxid)" style="cursor:pointer;">复制</a>
			</td>
			<td><input type="checkbox" v-model="aid" :value="item.cxid"></td>
		  </tr>
		</table>
		<br><br><br>

		<div class="BottomBanner">

			<div id="page1" class="cen Page" ></div>
			<div style="line-height: 50px; padding-right: 15px; position: absolute; right: 10px;
		bottom: 0px;" >

				<a class="layui-btn layui-btn-xs" @click="upTime()" >更新</a>
				<a class="layui-btn layui-btn-xs" @click="del()" >删除</a>
				<select @change="changeSort(qhFl)" v-model="qhFl">
					<option value="">切换分类</option>
					<option :value="item.cxid" v-for="item,key in sortList" >
						{{sortl(item.cxSort)+item.cxsortcn}}
					</option>
				</select>

				<select @change="changeZt(cxpassed)" v-model="cxpassed">
					<option value="">切换状态</option>
					<option :value="key" v-for="item,key in passedArr" >
						{{item}}
					</option>
				</select>
				<label >
				<input type="checkbox" v-model="checkAll"  @click="SelectAll()" >
					全选
				</label>
			</div>
		</div>

	</div>



	<div v-show="showEdit || showAdd">

		<h3 v-show="showEdit">修改信息</h3>
		<h3 v-show="showAdd">添加信息</h3>
		<form method="post" action="">

			<table class="table table-striped table-hover" >

				<tr>
					<td>所属分类：</td>
					<td>
						<select name="cxsortid" class="form-control" v-model="Info.cxsortid">
							<option :value="item.cxid" v-for="item,key in sortList">
								{{sortl(item.cxsort)+item.cxsortcn}}
							</option>
						</select>

					</td>
				</tr>
				<tr style="display: none;">
					<td>所属会员：</td>
					<td>
						<select name="cxuserid" class="form-control" v-model="Info.cxuserid">
							<option :value="item.cxid" v-for="item,key in userList">
								[{{item.cxid}}] {{item.cxname}}
							</option>
						</select>

					</td>
				</tr>

				<tr>
					<td>状态：</td>
					<td>
						<label v-for="item,key in passedArr" style="margin-right: 20px;">
							<input type="radio" :value="key" v-model="Info.cxpassed" :checked="key==Info.cxpassed?'checked':''">
							{{item}}
						</label>
					</td>
				</tr>
				<tr>
					<td>中文标题：</td>
					<td><input type="text" class="form-control wauto" v-model="Info.cxtitlecn"/></td>
				</tr>
				<tr>
					<td>分值 ：</td>
					<td><input type="number" class="form-control wauto" name="cxFen" v-model="Info.cxFen"/></td>
				</tr>

			</table>


			<div class="h110"></div>
			<div class="BottomBanner" v-if="showEdit">
				<a @click="submits('edit')" class="layui-btn layui-btn-normal">保存修改</a>
				<a @click="showEdit=false;showList=true;" class="layui-btn layui-btn-warm">返回</a>
			</div>
			<div class="BottomBanner" v-if="showAdd">
				<a @click="submits('add')" class="layui-btn layui-btn-normal">添加</a>
				<a @click="showAdd=false;showList=true;" class="layui-btn layui-btn-warm">返回</a>
			</div>
		</form>
	</div>





</div>

<public-footer class="public-footer"></public-footer>
</body>
</html>




<script>

	new Vue({el: ".public-header",});
	new Vue({el: ".public-footer",});


	var that;
	var biaoMing="cxkeyword";
    var app = new Vue({
        el: '#app',
        data:{
            msg: '这里是文字滚动公告这里是文字滚动公告这里是文字滚动公告......',
            List:[
            		{ShowMore:false}
            ],
            page:1,
            limit:20,
            pageCount:'',
            count:'',
			ShowMore:[],
			showEdit:false,
			showAdd:false,
			showList:true,
			sortList:[],
			qhFl:'',
			aid:[],
			checkAll:false,
			cxpassed:'',
			passedArr:['关闭','正常'],
            search:{
            	CheckBoxId:[],
                keyword:'',
				cxpassed:'',
                cxsortid:'',
                cxUserId:'',
                cxFormId:'',
                cxbz:'',
            },
			userList:'',
			mdata: [],
			Info:{
				cxsortcn:'',
				cxsorten:1,
				cxpid:'',
				cximg0:'',
				cximg1:'',
				cximg2:'',
				cximg3:'',
				cxsort:'',
				cxFen:'',
				cxpassed:2,
			},

        },
        mounted () {
            that = this;
            if(getQV('page')){that.page=getQV('page');}
            if(getQV('cxsortid')){that.search.cxsortid=getQV('cxsortid');}
            if(getQV('key')){
            	that.search.keywordName='cxsortcn|cxsorten'
            	that.search.keywordValue=getQV('key');
            }
			adminCheckToken(function () {
				that.getList(that.page, that.limit, that.search);
				that.getAllSort();
				that.getAllUser();
			});

        },
        methods:{
        	addInit(){
				that.mdata=[{
						"title": "",
						"content": ""
					}];
				that.Info={
					cxsortid:'',
					cxuserid:'',
					cxpassed:1,
					cxtitlecn:'',
					cxFen:'',
				};
				that.showList=false;
				that.showAdd=true;
			},
        	editInit(cid){
				that.showList=false;
				PostUrl('/bc.Home/getProInfo', {bm:biaoMing,cxid: cid}, function (e) {
					console.log('拉取客户详情成功');
					that.Info = e.data;
					that.showEdit=true;


				});
			},
			submits(act='add'){
				//layer.confirm('确定保存当前修改的内容么', function (index) {
					layer.load();
					let postD = {bm: biaoMing}
					Object.assign(postD, that.Info);
					PostUrl('/bc.Home/'+act, postD, function (e) {
						if(act=='add'){
							console.log('添加成功！');
							layer.msg('添加成功！', {time: 2000});
							that.showAdd=false;
						}else{
							console.log('修改成功！');
							layer.msg('保存成功！', {time: 2000});
							that.showEdit=false;
						}

						that.showList=true;
						setTimeout(function () {
							that.getList(that.page,that.limit,that.search);
						},1000)

					});

				//});
			},
        	getAllUser(){
				PostUrl('/bc.User/getlist', {}, function (e) {
					that.userList = e.data;
					console.log('拉取全部会员列表');
				});
			},
        	ShowAll(){
        		that.ShowMore.forEach(function (data,key) {
        			console.log(data);
					that.ShowMore[key]=true;
				})
			},
			SelectAll(){
        		that.checkAll=!that.checkAll;
        		if(that.checkAll==true){
        			that.aid=[];
					that.List.forEach(function (v,k) {
						that.aid.push(v.cxid);
					})
				}else{
        			that.aid=[];
				}
			},
        	ShowOpen(picUrl,t){
        		layer.open({
				  type: 1,
					shadeClose:true,
					title:t,
				  content: '<img src="'+picUrl+'" style="width:300px;">' //这里content是一个普通的String
				});
			},
        	changeS(key){
        		console.log(key);
        		console.log(that.ShowMore[key]);
        		that.$set(that.ShowMore,key,!that.ShowMore[key]);
        		console.log(that.ShowMore[key]);
			},
			getAllSort(){

				PostUrl('/bc.Home/getAllProSort',{},function(e){
					that.sortList=e.data;
					console.log('拉取全部分类数据成功');
				});
			},
			getList(page,limit,search){
        		layer.load();
				search.page=page;
				search.limit=limit;

				PostUrl('/bc.select?table='+biaoMing,search,function(e){
					layer.closeAll();
				  that.List=e.data;
					that.count=e.count;
					that.page=e.page;
					that.pageCount=e.pageCount;
					that.fenye();


					console.log('产品列表拉取结束 ')

				});

			},
			fenye(){
				that.$nextTick(function () {

						layui.use('laypage', function(){
							var laypage = layui.laypage;

							//执行一个laypage实例
							laypage.render({
								elem: 'page1' //注意，这里的 test1 是 ID，不用加 # 号
								,count: that.count //数据总数，从服务端得到
								,limit: that.limit
								,curr: location.hash.replace('#!page=', '') //获取起始页
								,limits:[10, 20, 30, 40, 50]
								,layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip']
									,hash: 'page' //自定义hash值
								,jump: function(obj, first){
									//obj包含了当前分页的所有参数，比如：
									console.log(obj.curr); //得到当前页，以便向服务端请求对应页的数据。
									console.log(obj.limit); //得到每页显示的条数


									//首次不执行
									if(!first){
										//do something

										that.getList(obj.curr,obj.limit,that.search);
									}
								}
							});
						});
					})
			},
			copy(cid){
					PostUrl('/bc.Home/copy', {bm:biaoMing,cxid:cid},function(e){
						layer.msg('复制成功');
						console.log('复制成功');
						that.getList(that.page,that.limit,that.search);
					});
			},
			del(){
				layer.confirm('确定删除?', function(index){
					layer.load();
					PostUrl('/bc.Home/del', {bm:biaoMing,cxid:that.aid},function(e){
						layer.closeAll();
						console.log('删除成功')
						that.checkAll=false;
						that.getList(that.page,that.limit,that.search);
					});
					layer.close(index);
				});
			},
			upTime(){
				//layer.confirm('确定更新勾选的数据最后更新时间?', function(index){
					layer.load();
					PostUrl('/bc.Home/upTime', {bm:biaoMing,cxid:that.aid},function(e){
						layer.closeAll();
						//console.log('删除成功')
						that.getList(that.page,that.limit,that.search);
					});
					layer.close(index);
				//});
			},
			changeSort(sid){
        		layer.confirm('确定变更勾选的信息的分类吗?', function(index){
					layer.load();
					PostUrl('/bc.Home/changeSort', {bm:biaoMing,cxid:that.aid,cxsortid:sid},function(e){
						layer.closeAll();
						console.log('变更成功')
						that.getList(that.page,that.limit,that.search);
					});
					layer.close(index);
				});
			},
			changeZt(zt){
				layer.confirm('确定变更勾选的信息的状态吗?', function(index){
					layer.load();
					PostUrl('/bc.Home/upZt', {bm:biaoMing,cxid:that.aid,cxpassed:zt},function(e){
						layer.closeAll();
						console.log('变更成功')
						that.getList(that.page,that.limit,that.search);
					});
					layer.close(index);
				});
			},
        }
	});
</script>
