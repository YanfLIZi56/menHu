<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
	<title>数据管理中心</title>


	<!-- Bootstrap  -->
	<link rel="stylesheet" href="https://api.bcwhkj.cn/bootstrap-3.3.7-dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://api.bcwhkj.cn/bootstrap-3.3.7-dist/css/bootstrap-theme.min.css">
	<script type="text/javascript" src="https://api.bcwhkj.cn/Js/jquery1.11.3.min.js"></script>
	<script src="https://api.bcwhkj.cn/bootstrap-3.3.7-dist/js/bootstrap.min.js"></script>

	<link href="https://api.bcwhkj.cn/Css/animate.min.css" rel="stylesheet">

	<link rel="stylesheet" type="text/css" href="https://api.bcwhkj.cn/swiper/swiper.css"/>
	<script src="https://api.bcwhkj.cn/swiper/swiper.js"></script>


	<link rel="stylesheet" href="../js/layui/dist/css/layui.css">
	<script src="../js/layui/dist/layui.js"></script>

	<script src="https://api.bcwhkj.cn/Js/vue.min.v2.6.14.js"></script>
	<script src="https://api.bcwhkj.cn/Js/axios.min.js"></script>
	<script src="https://api.bcwhkj.cn/Js/moment.min.js"></script>
	<script src="https://api.bcwhkj.cn/Js/qs.min.js"></script>
	<script src="https://api.bcwhkj.cn/Js/wow.min.js"></script>

	<script src="header.js"></script>
	<script src="footer.js"></script>
	<script src="/js/pubjs.js"></script>
	<script src="js/admin.js"></script>
	<script src="js/publicFcuntion.js"></script>
	<link rel="stylesheet" href="css/admin.css">

	<!--百度编辑器-->
	<script type="text/javascript" src="/static/baidu/ueditor.config.js"></script>
	<script type="text/javascript" src="/static/baidu/ueditor.all.js"></script>


</head>
<body>
<public-header class="public-header"></public-header>
<div id="app">

	<div  v-show="showList">
		<div class="DaoHan">
			<ul class="breadcrumb">
				<li>
					<a href="#"><h5> 留言信息列表 </h5></a>
				</li>
			</ul>
			<form action="">
				<input type="button"  name="" @click="getList()" value="刷新" style="display: inline;">
				<select  v-model="search.cxpassed">
					<option value="">搜索状态</option>
					<option :value="key" v-for="item,key in passedArr" >
						{{item}}
					</option>
				</select>
				<input type="text"   style="display: inline;" v-model="search.keyword" placeholder="" @keyup.enter="getList(page,limit,search)">

				<input  type="button" @click="getList()" value="查询"    style="display: inline;">
				<input type="button"  name="" @click="addInit()" value="添加数据" style="display: none;">


				<div style="float:none; clear: both;"></div>
			</form>
			<div class="clearfix"></div>
		</div>

		<table class="layui-table" lay-even>
			<tr>
				<td>ID</td>
				<td>状态</td>
				<td>姓名</td>
				<td>手机</td>
				<td>人数</td>
				<td>预约时间</td>
				<td>更新时间</td>
				<td style="display: none;">操作</td>
				<td >勾选</td>
			</tr>
			<tr v-for="item,key in List" :class="'tr'+item.cxid">
				<td>{{item.cxid}}</td>
				<td>

					<a @click="aid=item.cxid;upAttr(biaoMing,'cxisRead',item.cxisRead==0?1:0)"
					   :class="item.cxisRead==0?'colorRed':''"
					   :title="'点击设置为'+readArr[item.cxisRead==0?1:0]">
						{{readArr[item.cxisRead]}}</a>
				</td>
				<td>{{item.cxtitlecn}}</td>
				<td>{{item.cxphone}}</td>
				<td>{{item.cxRenShu}}</td>
				<td>{{item.cxYuYueTime}}</td>
				<td>{{item.cxupdatetime}}</td>
				<td style="display: none;"><a @click="editInit(item.cxid)" >编辑</a></td>
				<td><input type="checkbox" v-model="aid" :value="item.cxid"></td>
			</tr>
		</table>
		<br><br><br>

		<div class="BottomBanner">

			<div id="page1" class="cen Page" ></div>
			<div style="line-height: 50px; padding-right: 15px; position: absolute; right: 10px;
		bottom: 0px;" >

				<a class="layui-btn layui-btn-xs" @click="upTime(biaoMing)" v-if="aid.length>0">更新</a>
				<a class="layui-btn layui-btn-xs" @click="del(biaoMing)"  v-if="aid.length>0">删除</a>

				<select @change="changeZt(biaoMing,cxpassed)" v-model="cxpassed" v-if="aid.length>0" style="display: none;">
					<option value="">切换状态</option>
					<option :value="key" v-for="item,key in passedArr" >
						{{item}}
					</option>
				</select>
				<select @change="upAttr(biaoMing,'cxisRead',cxisRead)" v-model="cxisRead" v-if="aid.length>0">
					<option value="">切换 已读/未读</option>
					<option :value="key" v-for="item,key in readArr" >
						{{item}}
					</option>
				</select>
				<label >
					<input type="checkbox" v-model="checkAll"  @click="SelectAll(List)" >
					全选
				</label>
			</div>
		</div>

	</div>



	<div v-show="showEdit || showAdd" >

		<h3 v-show="showEdit">修改信息</h3>
		<h3 v-show="showAdd">添加信息</h3>


		<table class="layui-table" lay-even>

			<tr>
				<td>状态：</td>
				<td>
					<label  v-for="item,key in passedArr" style="margin-right: 20px;">
						<input type="radio" :value="key" v-model="Info.cxpassed" >
						{{item}}
					</label>
				</td>
			</tr>
			<tr>
				<td>是否已读：</td>
				<td>
					<label  v-for="item,key in readArr" style="margin-right: 20px;">
						<input type="radio" :value="key" v-model="Info.cxisRead" >
						{{item}}
					</label>
				</td>
			</tr>
			<tr>
				<td>标题：</td>
				<td><input type="text" class="form-control "  v-model="Info.cxtitlecn"/></td>
			</tr>
			<tr>
				<td>公司名：</td>
				<td><input type="text" class="form-control "  v-model="Info.cxcompany"/></td>
			</tr>
			<tr>
				<td>地址：</td>
				<td><input type="text" class="form-control "  v-model="Info.cxaddress"/></td>
			</tr>
			<tr>
				<td>法定代表人：</td>
				<td><input type="text" class="form-control "  v-model="Info.cxCst_faDingWaiBiaoRen"/></td>
			</tr>
			<tr>
				<td>电话：</td>
				<td><input type="text" class="form-control "  v-model="Info.cxphone"/></td>
			</tr>
			<tr>
				<td>业务介绍：</td>
				<td><input type="text" class="form-control "  v-model="Info.cxCst_YeWuJieShao"/></td>
			</tr>
			<tr>
				<td>业务联系人：</td>
				<td><input type="text" class="form-control "  v-model="Info.cxCst_YeWuRen"/></td>
			</tr>
			<tr>
				<td>执照：</td>
				<td>
					<img :src="Info.cximg0" style="max-height: 80px; max-width:100px;" v-show="Info.cximg0" @click="openImg(Info.cximg0)">
					<input type="text" name="cximg0" v-model="Info.cximg0" placeholder="粘贴图片路径">
					<input type="file" ref="cximg0" @change="uploadFile('cximg0','Info.cximg0')">
				</td>
			</tr>
			<tr>
				<td>公司/产品图片：</td>
				<td>
					<img :src="Info.cximg1" style="max-height: 80px; max-width:100px;" v-show="Info.cximg1" @click="openImg(Info.cximg1)">
					<input type="text" name="cximg1" v-model="Info.cximg1" placeholder="粘贴图片路径">
					<input type="file" ref="cximg1" @change="uploadFile('cximg1','Info.cximg1')">
				</td>
			</tr>
			<tr v-if="showEdit">
				<td>录入时间：</td>
				<td><input type="date" class="form-control wauto"  v-model="moment(Info.cxaddtime).format('YYYY-MM-DD')"/></td>
			</tr>
			<tr v-if="showEdit">
				<td>最后修改时间：</td>
				<td><input type="date" class="form-control wauto"  v-model="moment(Info.cxupdatetime).format('YYYY-MM-DD')"/></td>
			</tr>

		</table>



		<div class="h110"></div>
		<div class="BottomBanner" v-show="showAdd">
			<a @click="submits('add')" class="layui-btn layui-btn-normal">添加</a>
			<a @click="showAdd=false;showList=true;" class="layui-btn layui-btn-warm">返回</a>
		</div>
		<div class="BottomBanner" v-show="showEdit">
			<a @click="submits('edit')" class="layui-btn layui-btn-normal">保存修改</a>
			<a @click="showEdit=false;showList=true;" class="layui-btn layui-btn-warm">返回</a>
		</div>

	</div>



</div>

<public-footer class="public-footer"></public-footer>
</body>
</html>




<script>

	new Vue({el: ".public-header",});
	new Vue({el: ".public-footer",});


	var that;
	var biaoMing="cxguestbook";
	var app = new Vue({
		el: '#app',
		data:{
			msg: '这里是文字滚动公告这里是文字滚动公告这里是文字滚动公告......',
			List:[
				{ShowMore:false}
			],
			allKaSortList:[],
			pageCount:'',
			count:'',
			ShowMore:[],
			showEdit:false,
			showAdd:false,
			showList:true,
			sortList:[],
			userList:'',
			qhFl:'',
			aid:[],
			checkAll:false,
			cxpassed:'',
			cxisRead:'',
			passedArr:['关闭','正常'],
			readArr:['未读','已读'],
			search:{
				page:1,
				limit:20,
				CheckBoxId:[],
				keyword:'',
				cxpassed:'',
				cxbz:'',
			},

			Info:{
			},

		},
		mounted () {
			that = this;
			adminCheckToken(function () {

				if(getQV('page')){that.page=getQV('page');}
				if(getQV('cxsortid')){that.search.cxsortid=getQV('cxsortid');}
				if(getQV('key')){
					that.search.keywordName='cxsortcn|cxsorten'
					that.search.keywordValue=getQV('key');
				}
				that.search.adminToken=localStorage.adminToken;
				that.getList();

				// PostUrl('/bc.Wanneng/getList?table=cxnews_sort',{limit:999},function(e){
				// 	that.sortList=e.data.rows;
				// 	console.log('全部文章分类拉取结束 ')
				//
				// });
			});

		},
		methods:{
			addInit(){
				that.Info={
					cxpassed:1,
					cxsortid:0,
					cxtitlecn:'',
					cxlink:'',
					cximg0:'',
					cxcolor:'',
					cxaddtime:'',
					cxupdatetime:'',
				};
				that.showList=false;
				that.showAdd=true;
			},
			editInit(cid){
				that.showList=false;
				PostUrl('/bc.Wanneng/Info', {table:biaoMing,cxid: cid,adminToken:localStorage.adminToken}, function (e) {
					console.log('拉取客户详情成功');
					that.Info = e.data;
					var ue1 = UE.getEditor('cxcontentcn');
					// ue1.ready(function () {
					// 	that.Info.cxcontentcn ? ue1.setContent(that.Info.cxcontentcn) : '';
					// });
					// var ue2 = UE.getEditor('cxcontenten');
					// ue2.ready(function () {
					// 	ue2.setContent(that.Info.cxcontenten);
					// });
					// var ue3 = UE.getEditor('cxcontentWapcn');
					// ue3.ready(function () {
					// 	ue3.setContent(that.Info.cxcontentWapcn);
					// });
					// var ue4 = UE.getEditor('cxcontentWapen');
					// ue4.ready(function () {
					// 	ue4.setContent(that.Info.cxcontentWapen);
					// });



					that.showEdit=true;
				});
			},
			submits(act='add'){
				layer.confirm('确定保存当前修改的内容么', function (index) {
					layer.load();


					// var ue1 = UE.getEditor('cxcontentcn');
					// that.Info.cxcontentcn = ue1.getContent();
					// var ue2 = UE.getEditor('cxcontenten');
					// that.Info.cxcontenten = ue2.getContent();
					// var ue3 = UE.getEditor('cxcontentWapcn');
					// that.Info.cxcontentWapcn = ue3.getContent();
					// var ue4 = UE.getEditor('cxcontentWapen');
					// that.Info.cxcontentWapen = ue4.getContent();
					let postD = {table: biaoMing}
					Object.assign(postD, that.Info);

					if(act=='add'){
						delete postD.cxaddtime;
						delete postD.cxupdatetime;
					}
					postD.adminToken=localStorage.adminToken;
					PostUrl('/bc.Wanneng/'+act, postD, function (e) {

						layer.msg(e.msg);
							that.getList();
						that.showEdit=false;
						that.showAdd=false;
						that.showList=true;
					});

					layer.closeAll();
				});
			},
			getList(){
				PostUrl('/bc.Wanneng/getList?table='+biaoMing,that.search,function(e){
					that.List=e.data.rows;
					that.count=e.data.count;
					that.pageCount=e.data.pageCount;
					fenye();


					console.log('产品列表拉取结束 ')

				},'本页 - 列表');



			},
		}
	});
</script>
