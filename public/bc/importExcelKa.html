<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
	<title>数据管理中心</title>


	<!-- Bootstrap  -->
	<link rel="stylesheet" href="https://api.bcwhkj.cn/bootstrap-3.3.7-dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://api.bcwhkj.cn/bootstrap-3.3.7-dist/css/bootstrap-theme.min.css">
	<script type="text/javascript" src="https://api.bcwhkj.cn/Js/jquery1.11.3.min.js"></script>
	<script src="https://api.bcwhkj.cn/bootstrap-3.3.7-dist/js/bootstrap.min.js"></script>

	<link href="https://api.bcwhkj.cn/Css/animate.min.css" rel="stylesheet">

	<link rel="stylesheet" type="text/css" href="https://api.bcwhkj.cn/swiper/swiper.css"/>
	<script src="https://api.bcwhkj.cn/swiper/swiper.js"></script>


	<link rel="stylesheet" href="https://api.bcwhkj.cn/layui2/dist/css/layui.css">
	<script src="https://api.bcwhkj.cn/layui2/dist/layui.js"></script>

	<script src="https://api.bcwhkj.cn/Js/vue.min.v2.6.14.js"></script>
	<script src="https://api.bcwhkj.cn/Js/axios.min.js"></script>
	<script src="https://api.bcwhkj.cn/Js/moment.min.js"></script>
	<script src="https://api.bcwhkj.cn/Js/qs.min.js"></script>
	<script src="https://api.bcwhkj.cn/Js/wow.min.js"></script>

	<script src="header.js"></script>
	<script src="footer.js"></script>
	<script src="/js/pubjs.js"></script>
	<script src="js/admin.js"></script>
	<script src="js/publicFcuntion.js"></script>
	<link rel="stylesheet" href="css/admin.css">



</head>
<body>

<style>
	.ctable {width:100%;}
	.ctable td{ border:1px solid #000; padding:3px; font-size: 10px;}
</style>
<public-header class="public-header"></public-header>
<div id="app">






	<div>

		<h3>EXCEL导入虚拟卡数据</h3>
		<form method="post" action="">

			<table class="layui-table" lay-even>
				<tr>
					<td>Excel范本</td>
					<td><a href="https://vkceyugu.cdn.bspapp.com/VKCEYUGU-908027cd-0849-4303-ae20-d3bed9830e3a/0f2b2f74-e7f9-4458-88a4-e9f5fe6297ff.xlsx" target="_blank" class="layui-btn">点击下载</a> 需按范本内容严格填写，将填写后的范本上传才可被系统进行识别</td>
				</tr>
				<tr>
					<td>EXCEL上传</td>
					<td>
						<input type="text" name="cximg0" v-model="Info.excel" placeholder="粘贴图片路径">
						<input type="file" ref="cximg0" @change="uploadFile('cximg0','Info.excel')">


						<a @click="openSrc('http://sxl.bcwhkj.cn/bc.Sxl/excelSee?excel='+Info.excel)" target="_blank" v-if="Info.excel" class="layui-btn">点击这里先确认预导入的内容是否正确</a>
						<br><br>
						<span style="color: #f00;">注：上传完成后需点击下方的确认导入才是真正的导入。</span>

					</td>
				</tr>
				<tr>
					<td>选择卡类别</td>
					<td>

						<select class="form-control" v-model="Info.toId">
							<option :value="item.cxid" v-for="item,key in allKaSortList" >
								{{item.cxid}} - {{item.cxsortcn}}
							</option>
						</select>
						<a @click="openSrc('kehu.html?cxuserid=')" target="_blank" style="display: none;" class="layui-btn">查看此人员名下客户列表</a>
					</td>
				</tr>
				<tr>
					<td>选择所属合作商</td>
					<td>
						<select class="form-control" v-model="Info.cxHeZuoId">
							<option :value="item.cxid" v-for="item,key in heZuoList" >
								{{item.cxid}} - {{item.cxname}}
							</option>
						</select>
					</td>
				</tr>
				<tr>
					<td>过滤</td>
					<td><label><input type="checkbox" v-model="Info.checkSame" value="cxka"> 重复卡号不导入</label></td>
				</tr>
				<tr>
					<td>选择</td>
					<td><label><input type="checkbox" v-model="Info.del" value="yes"> 导入完成后删除原EXCEL文件</label></td>
				</tr>
				<tr>
					<td>导入结果</td>
					<td style="color: #f00; font-size: 20px;">
						{{msg}}

						<br>
						<div v-if="List.length>0">以下信息导入失败,对应手机号已存在现有客户表中</div>
						<table class="table table-striped table-hover">
						<tr v-for="item,key in List">
							<td>{{key+1}}</td>
							<td style="font-size: 12px;" v-for="items,keys in item">{{items}}
							</td>
						</tr>
						</table>
					</td>
				</tr>


			</table>

			<div class="h110"></div>
			<div class="BottomBanner">
				<a @click="submits()" class="layui-btn layui-btn-normal">确认导入</a>
				<a @click="history.go(0)" class="layui-btn layui-btn-warm">刷新页面</a>
				<a @click="history.go(-1)" class="layui-btn layui-btn-warm">返回</a>
			</div>


		</form>
	</div>




</div>

<public-footer class="public-footer"></public-footer>
</body>
</html>




<script>

	new Vue({el: ".public-header",});
	new Vue({el: ".public-footer",});


	var that;
	var biaoMing="cxka";
	var app = new Vue({
		el: '#app',
		data:{
			msg: '',
			List:[],
			allKaSortList:[],
			page:1,
			limit:20,
			pageCount:'',
			count:'',
			ShowMore:[],
			showEdit:false,
			showAdd:false,
			showList:true,
			sortList:[],
			heZuoList:[],
			userlevelList:'',
			qhFl:'',
			aid:[],
			checkAll:false,
			cxpassed:'',
			passedArr:['关闭','正常','推荐'],
			search:{
				CheckBoxId:[],
				keyword:'',
				cxpassed:'',
				cxsortid:'',
				cxUserId:'',
				cxFormId:'',
				order:'cxid desc',
				sl:'yewu',
			},
			userList:'',
			mdata: [],
			Info:{
				toId:'',
				excel:'',
				checkSame:['cxphone'],
				del:'',
			},
			file:'',


		},
		mounted () {
			that = this;
			if(getQV('page')){that.page=getQV('page');}
			if(getQV('cxsortid')){that.search.cxsortid=getQV('cxsortid');}
			if(getQV('key')){
				that.search.keywordName='cxsortcn|cxsorten'
				that.search.keywordValue=getQV('key');
			}
			adminCheckToken(function () {
				//that.getList(that.page,that.limit,that.search);
				//that.getAllSort();
				getAllUser();
				getAllKaSort();
				getAllHeZuoList();
				//that.getAllUserLevel();
			});

		},
		methods:{
			submits(){
				if(!that.Info.excel){
					layer.msg('请先上传EXCEL文件');
					return false;
				}
				if(!that.Info.toId){
					layer.msg('请先选择要导入到哪个卡类别下');
					return false;
				}
				//layer.confirm('确定保存当前修改的内容么', function (index) {
				//layer.load();
				let postD = that.Info;
				layer.load();
				PostUrl('/bc.Shop/excelDaoRuKa', postD, function (e) {
					layer.msg(e.mess);
					that.msg=e.mess;
					that.List=e.data.errData;
					setTimeout(function () {
						layer.closeAll();
					},2000)
				});

				//});
			},
			getAllUserLevel(){

				PostUrl('/bc.User/getProSort',{},function(e){
					that.userlevelList=e.data;
					console.log('拉取全部人员类型成功');
				});
			},
			getList(page,limit,search){
				layer.load();
				search.page=page;
				search.limit=limit;

				PostUrl('/bc.User/getlist',search,function(e){
					layer.closeAll();
					that.List=e.data;
					that.count=e.count;
					that.page=e.page;
					that.pageCount=e.pageCount;
					that.fenye();


					console.log('产品列表拉取结束 ')

				});

			},
		}
	});
</script>
