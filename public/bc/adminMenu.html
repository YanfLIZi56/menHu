<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
	<title>数据管理中心</title>


	<!-- Bootstrap  -->
	<link rel="stylesheet" href="https://api.bcwhkj.cn/bootstrap-3.3.7-dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://api.bcwhkj.cn/bootstrap-3.3.7-dist/css/bootstrap-theme.min.css">
	<script type="text/javascript" src="https://api.bcwhkj.cn/Js/jquery1.11.3.min.js"></script>
	<script src="https://api.bcwhkj.cn/bootstrap-3.3.7-dist/js/bootstrap.min.js"></script>

	<link href="https://api.bcwhkj.cn/Css/animate.min.css" rel="stylesheet">

	<link rel="stylesheet" type="text/css" href="https://api.bcwhkj.cn/swiper/swiper.css"/>
	<script src="https://api.bcwhkj.cn/swiper/swiper.js"></script>


	<link rel="stylesheet" href="../js/layui/dist/css/layui.css">
	<script src="../js/layui/dist/layui.js"></script>

	<script src="https://api.bcwhkj.cn/Js/vue.min.v2.6.14.js"></script>
	<script src="https://api.bcwhkj.cn/Js/axios.min.js"></script>
	<script src="https://api.bcwhkj.cn/Js/moment.min.js"></script>
	<script src="https://api.bcwhkj.cn/Js/qs.min.js"></script>
	<script src="https://api.bcwhkj.cn/Js/wow.min.js"></script>

	<script src="header.js"></script>
	<script src="footer.js"></script>
	<script src="/js/pubjs.js"></script>
	<script src="js/admin.js"></script>
	<script src="js/publicFcuntion.js"></script>
	<link rel="stylesheet" href="css/admin.css">

	<!--百度编辑器-->
	<script type="text/javascript" src="/static/baidu/ueditor.config.js"></script>
	<script type="text/javascript" src="/static/baidu/ueditor.all.js"></script>


</head>
<body>
<public-header class="public-header"></public-header>
<div id="app">

	<div  v-show="showList">
		<div class="DaoHan">
			<ul class="breadcrumb" >
				<li>
					<a href="#"><h5> 后台菜单列表 </h5></a>
				</li>
			</ul>
			<form action="">
				<input type="button"  name="" @click="history.go(0)" value="刷新" style="display: inline;">
				<select  v-model="search.cxpid">
					<option value="">搜索类别</option>
					<option value="0">只显示顶级类目</option>
					<option :value="item.cxid" v-for="item,key in allMenuList" v-if="item.cxpid==0">
						{{item.cxsortcn}}
					</option>
				</select>
				<select  v-model="search.cxpassed">
					<option value="">搜索状态</option>
					<option :value="key" v-for="item,key in passedArr" >
						{{item}}
					</option>
				</select>
				<input type="text"   style="display: inline;" v-model="search.keyword" placeholder="" @keyup.enter="getList()">

				<input  type="button" @click="getList()" value="查询"    style="display: inline;">
				<input type="button"  name="" @click="addInit()" value="添加数据" style="display: inline;">


				<div style="float:none; clear: both;"></div>
			</form>
			<div class="clearfix"></div>
		</div>

		<table class="layui-table" lay-even>
			<tr>
				<td>ID</td>
				<td>状态</td>
				<td>菜单名</td>
				<td>图标</td>
				<td>图片</td>
				<td>路径</td>
				<td>cxpids</td>
				<td>操作</td>
				<td>操作</td>
				<td style="display: none;">移动</td>
				<td >勾选</td>
			</tr>
			<tr v-for="item,key in List">
				<td :title="item.cxpids">{{item.cxid}}</td>
				<td>{{passedArr[item.cxpassed]}}</td>
				<td>
					{{sortl(item.cxpids)}} {{item.cxsortcn}}
				</td>
				<td><i :class="item.cxicon"></i></td>
				<td>
					<a :href="item.cximg0" target="_blank" v-if="item.cximg0" title="图1">
						<img :src="item.cximg0" alt="" style="max-width: 80px; max-height:40px; "></a>
					<a :href="item.cximg1" target="_blank" v-if="item.cximg1" title="图2">
						<img :src="item.cximg1" alt="" style="max-width: 80px; max-height:40px; "></a>
				</td>
				<td>{{item.cxurl}}</td>
				<td>{{item.cxpids}}</td>
				<td >
					<a @click="addInit(item.cxid)" v-if="item.cxpid==0">添加子栏目</a>
				</td>
				<td>
					<a @click="editInit(item.cxid)">编辑</a>
				</td>
				<td style="display: none;">
					<a @click="sortUp(item.cxid)" style="cursor:pointer;">▲</a>&nbsp;&nbsp;
					<a @click="sortDown(item.cxid)" style="cursor:pointer;">▼</a></td>
				<td><input type="checkbox" v-model="aid" :value="item.cxid"></td>
			</tr>
		</table>
		<br><br><br>

		<div class="BottomBanner">

			<div id="page1" class="cen Page" ></div>
			<div style="line-height: 50px; padding-right: 15px; position: absolute; right: 10px;
		bottom: 0px;" >

				<a class="layui-btn layui-btn-xs" @click="upTime(biaoMing)" >更新</a>
				<a class="layui-btn layui-btn-xs" @click="del(biaoMing)" >删除</a>

				<select @change="changeZt(biaoMing,cxpassed)" v-model="cxpassed">
					<option value="">切换状态</option>
					<option :value="key" v-for="item,key in passedArr" >
						{{item}}
					</option>
				</select>
				<label >
				<input type="checkbox" v-model="checkAll"  @click="SelectAll(List)" >
					全选
				</label>
			</div>
		</div>

	</div>



	<div v-show="showEdit || showAdd" >

		<h3 v-show="showEdit">修改信息</h3>
		<h3 v-show="showAdd">添加</h3>


		<table class="table table-striped table-hover" >

			<tr>
				<td>上级分类：</td>
				<td>
					<select name="cxuserlevel" class="form-control" v-model="Info.cxpid" >
						<option value="0">顶级分类</option>
						<option :value="item.cxid" v-for="item,key in AllList"  :select="item.cxid==Info.cxpid?'select':''" v-if="item.cxpid==0">
							{{sortl(item.cxsort) + item.cxsortcn}}
						</option>
					</select>

				</td>
			</tr>
			<tr>
				<td>状态：</td>
				<td>
					<label  v-for="item,key in passedArr" style="margin-right: 20px;">
						<input type="radio" :value="key" v-model="Info.cxpassed" :checked="key==Info.cxpassed?'checked':''">
						{{item}}
					</label>
				</td>
			</tr>
			<tr>
				<td>分类标题：</td>
				<td><input type="text" class="form-control wauto"  v-model="Info.cxsortcn"/></td>
			</tr>
			<tr>
				<td>英文标题：</td>
				<td><input type="text" class="form-control wauto" v-model="Info.cxsorten"/></td>
			</tr>
			<tr>
				<td>路径：</td>
				<td><input type="text" class="form-control wauto"  v-model="Info.cxurl"/></td>
			</tr>
			<tr>
				<td>图标：</td>
				<td>
					<i :class="Info.cxicon"></i>
					<input type="text" class="form-control wauto"  v-model="Info.cxicon"/>
					<a @click="Info.cxicon=Info.cxicon+' layui-icon '">layer前缀</a>
					<a @click="Info.cxicon=Info.cxicon+' iconfont '">iconfont前缀</a>
					<a href="https://www.layuiweb.com/doc/element/icon.html" target="_blank">layer图标选择</a>

				</td>
			</tr>
			<tr>
				<td>图片1：</td>
				<td>
					<img :src="Info.cximg0" style="max-height: 80px; max-width:100px;" v-show="Info.cximg0" @click="window.open(Info.cximg0)">
					<input type="text" name="cximg0" v-model="Info.cximg0" placeholder="粘贴图片路径">
					<input type="file" ref="cximg0" @change="uploadFile('cximg0','Info.cximg0')">
				</td>
			</tr>
			<tr>
				<td>图片2：</td>
				<td>

					<img :src="Info.cximg1" style="max-height: 80px; max-width:100px;" v-show="Info.cximg1" @click="window.open(Info.cximg1)">
					<input type="text" name="cximg1" v-model="Info.cximg1" placeholder="粘贴图片路径">
					<input type="file" ref="cximg1" @change="uploadFile('cximg1','Info.cximg1')">

				</td>
			</tr>
			<tr style="display: none;">
				<td>图片3：</td>
				<td>

					<img :src="Info.cximg2" style="max-height: 80px; max-width:100px;" v-show="Info.cximg2" @click="window.open(Info.cximg2)">
					<input type="text" name="cximg2" v-model="Info.cximg2" placeholder="粘贴图片路径">
					<input type="file" ref="cximg2" @change="uploadFile('cximg2','Info.cximg2')">

				</td>
			</tr>
			<tr style="display: none;">
				<td>图片4：</td>
				<td>

					<img :src="Info.cximg3" style="max-height: 80px; max-width:100px;" v-show="Info.cximg3" @click="window.open(Info.cximg3)">
					<input type="text" name="cximg3" v-model="Info.cximg3" placeholder="粘贴图片路径">
					<input type="file" ref="cximg3" @change="uploadFile('cximg3','Info.cximg3')">

				</td>
			</tr>

		</table>



		<div class="h110"></div>
		<div class="BottomBanner" v-show="showEdit">
			<a @click="submits('edit')" class="layui-btn layui-btn-normal">保存修改</a>
			<a @click="showEdit=false;showList=true;" class="layui-btn layui-btn-warm">返回</a>

		</div>
		<div class="BottomBanner" v-show="showAdd">
			<a @click="submits('add')" class="layui-btn layui-btn-normal">添加</a>
			<a @click="showAdd=false;showList=true;" class="layui-btn layui-btn-warm">返回</a>

		</div>

	</div>





</div>

<public-footer class="public-footer"></public-footer>
</body>
</html>




<script>

	new Vue({el: ".public-header",});
	new Vue({el: ".public-footer",});


	var that;
	var biaoMing="cxzy";
    var app = new Vue({
        el: '#app',
        data:{
            msg: '这里是文字滚动公告这里是文字滚动公告这里是文字滚动公告......',
            List:[
            		{ShowMore:false}
            ],
            pageCount:'',
            count:'',
			ShowMore:[],
			showEdit:false,
			showAdd:false,
			showList:true,
			sortList:[],
			qhFl:'',
			aid:[],
			checkAll:false,
			cxpassed:'',
			passedArr:['隐藏','显示'],
            search:{
				page:1,
				limit:999,
            	CheckBoxId:[],
                keyword:'',
				cxpassed:'',
				cxpid:'',
				order:'cxpids asc,cxupdatetime desc,cxid desc',
				table:biaoMing,
            },
			userList:'',

			Info:{
				cxpid:'',
				cxpassed:'',
				cxsort:'',
				cxsortcn:'',
				cxsorten:'',
				cxurl:'',
				cximg0:'',
				cximg1:'',
				cximg2:'',
				cximg3:'',

			},
			AllList:[],
			allMenuList:[],

        },
        mounted () {
            that = this;
            adminCheckToken(function () {

				if(getPage('page')){that.search.page=getPage('page');}
				if(getQV('cxsortid')){that.search.cxsortid=getQV('cxsortid');}
				if(getQV('key')){
					that.search.keywordName='cxsortcn|cxsorten'
					that.search.keywordValue=getQV('key');
				}
				that.getList();
				that.getAllMenuSort();

				PostUrl('/bc.Wanneng/getList', {
					table:biaoMing,
					limit: 999,
					order: 'cxupdatetime desc,cxid desc'
				}, function (e) {
					that.allMenuList = e.data.rows;
				},'摘取全部菜单')

			});

        },
        methods:{
        	addInit(pid){

				that.Info={
					cxpid:pid,
					cxpassed:1,
					cxsort:'',
					cxsortcn:'',
					cxsorten:'',
					cxurl:'',
					cxicon:'',
					cximg0:'',
					cximg1:'',
					cximg2:'',
					cximg3:'',
				};
				that.showList=false;
				that.showAdd=true;
			},
        	editInit(cid){
				that.showList=false;
				PostUrl('/bc.Home/getProInfo', {bm:biaoMing,cxid: cid}, function (e) {
					console.log('拉取客户详情成功');
					that.Info = e.data;
					that.showEdit=true;


				});
			},
			submits(act='add'){
				//layer.confirm('确定保存当前修改的内容么', function (index) {
					layer.load();
					let postD = {table: biaoMing}
					// var ue1 = UE.getEditor('cxcontentcn');
					// that.Info.cxcontentcn = ue1.getContent();
					// var ue2 = UE.getEditor('cxcontenten');
					// that.Info.cxcontenten = ue2.getContent();
					// var ue3 = UE.getEditor('cxcontentWapcn');
					// that.Info.cxcontentWapcn = ue3.getContent();
					// var ue4 = UE.getEditor('cxcontentWapen');
					// that.Info.cxcontentWapen = ue4.getContent();
					Object.assign(postD, that.Info);
					if(act=='add'){
						postD.cxupdatetime=Now();
						postD.cxaddtime=Now();
					}
					if(postD.cxpid>0){
						postD.cxpids=postD.cxpid+','+postD.cxid+','
					}else{
						postD.cxpids=postD.cxid+','
					}
					postD.adminToken=localStorage.adminToken;
					PostUrl('/bc.Wanneng/'+act, postD, function (e) {
						console.log(e.mess);
						that.getList();
						layer.msg(e.mess, {time: 2000});

					});

					layer.closeAll();
				//});
			},
			getList(){

				PostUrl('/bc.Wanneng/getList',that.search,function(e){
					that.List=e.data.rows;
					that.count=e.data.count;
					that.pageCount=e.data.pageCount;
					fenye();


					console.log('产品列表拉取结束 ')

				});

			},
			getAllMenuSort(){
				PostUrl('/bc.Wanneng/getList',{table:biaoMing,limit:999},function(e){
					that.AllList=e.data.rows;
					console.log('产品列表拉取结束 ')

				});

			},

        }
	});
</script>
